name: cevami-production

services:
  database:
    image: postgres:18-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    user: "999:999"
    environment:
      POSTGRES_DB: cevami
      POSTGRES_USER: cevami_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [pg_admin_password]
    volumes: [pg_data:/var/lib/postgresql]
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cevami_owner -d cevami"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &bounded_logs
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  app:
    build: {context: ..}
    image: cevami:0.1.0
    environment:
      HADIS_ENV: production
      HADIS_PUBLIC_ORIGIN: https://${CEVAMI_DOMAIN:?Set CEVAMI_DOMAIN in deploy/.env}
      HADIS_DATA_ROOT: /workspace/data
      HADIS_DB_HOST: database
      HADIS_DB_NAME: cevami
      HADIS_DB_USER: cevami_web
      HADIS_DB_PASSWORD_FILE: /run/secrets/web_db_password
      HADIS_PROXY_IP: ${CEVAMI_PROXY_IP:-172.30.80.2}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    secrets: [web_db_password]
    volumes:
      - ${CEVAMI_DATA_DIR:-../.local/deploy-data/v0.1.0}:/workspace/data:ro
    networks: [backend]
    depends_on:
      database: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, /workspace/app/deploy/healthcheck.py]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 300s
    logging: *bounded_logs

  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    user: "1000:1000"
    environment:
      CEVAMI_DOMAIN: ${CEVAMI_DOMAIN:?Set CEVAMI_DOMAIN in deploy/.env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    networks:
      edge: {}
      backend: {ipv4_address: "${CEVAMI_PROXY_IP:-172.30.80.2}"}
    depends_on:
      app: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped
    logging: *bounded_logs

  restore:
    profiles: [tools]
    image: postgres:18-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    entrypoint: [sh, /opt/cevami/restore.sh]
    environment: {PGHOST: database, PGDATABASE: cevami, PGUSER: cevami_owner}
    secrets: [pg_admin_password, web_db_password]
    volumes:
      - ./restore.sh:/opt/cevami/restore.sh:ro
      - ${CEVAMI_DATA_DIR:-../.local/deploy-data/v0.1.0}:/workspace/data:ro
    networks: [backend]
    depends_on:
      database: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    logging: *bounded_logs

networks:
  edge: {}
  backend:
    internal: true
    ipam:
      config:
        - subnet: "${CEVAMI_BACKEND_SUBNET:-172.30.80.0/24}"
          ip_range: "${CEVAMI_BACKEND_DYNAMIC_RANGE:-172.30.80.128/25}"

volumes:
  pg_data: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  pg_admin_password: {file: ./secrets/pg_admin_password}
  web_db_password: {file: ./secrets/web_db_password}
