name: Code and security checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {lfs: false, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - run: python -m pip install pip==26.3 && python -m pip install -r requirements.lock
      - run: python -m pytest tests/test_security.py tests/test_production.py tests/test_data_release.py tests/test_production_setup.py tests/test_deployment_config.py tests/test_restore_transaction.py tests/test_presentation.py -q
      - run: node --test tests/ui_pagination.cjs tests/ui_home_recovery.cjs
      - run: python -m compileall -q hadis_web scripts && python -m pip check
      - run: docker compose -f deploy/compose.yml config --quiet
        env: {CEVAMI_DOMAIN: ci.example.invalid}
      - run: docker build --tag cevami:ci .
